<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeST-VNN</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #ffffff; --surf: #f6f8fa; --border: #d0d7de;
  --accent: #0969da; --text: #1f2328; --muted: #656d76;
}
html, body { height: 100%; overflow: hidden; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; flex-direction: column; }
.tab-bar {
  display: flex; align-items: center; gap: 0;
  background: var(--surf); border-bottom: 1px solid var(--border);
  padding: 0 16px; height: 44px; flex-shrink: 0;
}
.tab-bar .logo { font-weight: 700; font-size: 15px; margin-right: 24px; color: var(--text); }
.tab-bar button {
  background: none; border: none; border-bottom: 2px solid transparent;
  padding: 10px 16px; font-size: 13px; font-weight: 500; cursor: pointer;
  color: var(--muted); transition: all .15s;
}
.tab-bar button:hover { color: var(--text); }
.tab-bar button.active { color: var(--accent); border-bottom-color: var(--accent); }
iframe { flex: 1; border: none; width: 100%; }
</style>
</head>
<body>
<div class="tab-bar">
  <span class="logo">NeST-VNN</span>
  <button data-tab="dashboard" class="active">Dashboard</button>
  <button data-tab="interpretation">LLM Interpretation</button>
  <button data-tab="explorer">NeST-STRING Explorer</button>
</div>
<iframe id="content" src="dashboard.html"></iframe>
<script>
const tabs = {
  dashboard: 'dashboard.html',
  interpretation: 'interpretation.html',
  explorer: 'explorer.html?embedded=1'
};
const iframe = document.getElementById('content');
const buttons = document.querySelectorAll('.tab-bar button[data-tab]');

function switchTab(name) {
  buttons.forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  iframe.src = tabs[name];
  sessionStorage.setItem('activeTab', name);
}

buttons.forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));

const saved = sessionStorage.getItem('activeTab');
if (saved && tabs[saved]) switchTab(saved);
</script>
</body>
</html>
